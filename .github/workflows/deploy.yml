# CI/CD Mirai Lounge (Slim + Postgres + Vite) — self-hosted runner.
#
# CI  (push/PR): composer + PHPUnit (unit) + PHPStan + Vite build → артефакт dist.
# CD  (push main): на self-hosted runner НА СЕРВЕРЕ — локальный rsync в DEPLOY_PATH →
#     docker compose (платформа + стек) → phinx migrate → проверка живости.
#
# Почему self-hosted: сервер за NAT и с парольным SSH — GitHub-hosted раннер туда не
# ходит. Runner на сервере сам забирает задания исходящим HTTPS: ни SSH, ни секретов,
# ни проброса. Регистрация раннера — SERVER_SETUP.md, шаг 19 (labels: self-hosted,mirai-prod).
# Данные НЕ трогаем: импорт справочников — разовый (bin/import-*), не в пайплайне.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      APP_ENV: dev
      MIRAI_TABLE_SIGNING_KEY: ci-signing-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, fileinfo, zip
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Unit не требует БД. Интеграционные (нужен Postgres + сиды) — локально/на сервере.
      - name: PHPUnit (unit)
        run: php vendor/bin/phpunit --testsuite unit

      - name: PHPStan
        run: php vendor/bin/phpstan analyse src --level=5 --no-progress --memory-limit=1G

      - name: Node + Vite build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci && npm run build

      # Собранные бандлы отдаём артефактом — на сервере Node не нужен.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: public/dist/
          retention-days: 3

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mirai-prod]
    env:
      DEPLOY_PATH: /var/www/mirailounge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: public/dist/

      # Локальная выкладка: без сети, без SSH, без паролей. Исключения защищают
      # БД (data/pg), .env, серты, загрузки; png-ассеты возвращаем include'ами.
      - name: Выкладка в DEPLOY_PATH
        run: |
          rsync -a --delete \
            --include='/public/assets/booking/***' \
            --include='/public/assets/img/vitrina/***' \
            --exclude-from=scripts/deploy-excludes.txt \
            ./ "$DEPLOY_PATH/"

      - name: Платформа, стек, миграции
        run: |
          cd "$DEPLOY_PATH/docker"
          docker compose -f platform/docker-compose.yml up -d   # общий Postgres (создаёт сеть)
          docker compose build php                              # vendor собирается в образе
          docker compose up -d                                  # nginx + php
          docker compose exec -T php php vendor/bin/phinx migrate -c phinx.php

      - name: Проверка живости
        run: |
          sleep 5
          curl -fsS -o /dev/null -w 'health: %{http_code}\n' \
            --resolve mirailounge.ru:443:127.0.0.1 https://mirailounge.ru/ || \
          curl -fsS -o /dev/null -w 'health(http): %{http_code}\n' http://127.0.0.1/_health
