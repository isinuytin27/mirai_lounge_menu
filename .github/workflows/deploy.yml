# CI/CD Mirai Lounge (новый стек: Slim + Postgres + Vite).
#
# CI  (push/PR): composer + PHPUnit (unit+integration против сервисного Postgres) + PHPStan + Vite build.
# CD  (push main): собрать артефакт (vendor --no-dev + dist), rsync на сервер, удалённо
#     docker compose build/up + миграции. Данные НЕ трогаем (импорт — разовый, вручную).
#
# Secrets репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY
# На сервере в <DEPLOY_PATH>/.env заданы POSTGRES_*, MIRAI_TABLE_SIGNING_KEY (fail-closed!), TG/VAPID.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      APP_ENV: dev
      MIRAI_TABLE_SIGNING_KEY: ci-signing-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, fileinfo, zip
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # Unit-тесты не требуют БД. Интеграционные (нужен Postgres + сиды данных)
      # гоняются локально/на сервере, не в CI.
      - name: PHPUnit (unit)
        run: php vendor/bin/phpunit --testsuite unit

      - name: PHPStan
        run: php vendor/bin/phpstan analyse src --level=5 --no-progress

      - name: Node + Vite build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vendor собирается на сервере (docker build). Здесь готовим только Vite-dist.
      - name: Node + Vite build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci && npm run build

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync на сервер
        run: |
          rsync -az --delete \
            --include='/public/assets/booking/***' \
            --exclude-from=scripts/deploy-excludes.txt \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Удалённо — платформа, стек, миграции
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -e
          cd "${{ secrets.DEPLOY_PATH }}/docker"
          # 1) общая платформа (Postgres) — поднять, если ещё не поднята
          docker compose -f platform/docker-compose.yml up -d
          # 2) стек сайта (пересобрать php при смене зависимостей, поднять)
          docker compose build php
          docker compose up -d
          # 3) миграции БД (идемпотентно). Импорт данных НЕ здесь — он разовый.
          docker compose exec -T php php vendor/bin/phinx migrate -c phinx.php
          REMOTE
