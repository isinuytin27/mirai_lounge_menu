# HTTP → HTTPS
server {
    listen 80;
    server_name mirailounge.ru www.mirailounge.ru;
    return 301 https://$host$request_uri;
}

# HTTPS — единый front controller (public/index.php, Slim).
server {
    listen 443 ssl http2;
    server_name mirailounge.ru www.mirailounge.ru;
    root /var/www/mirailounge/public;

    ssl_certificate     /etc/nginx/ssl/mirailounge.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mirailounge.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    index index.php;

    location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }

    location /dist/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|webp|webm|mp4)$ {
        expires 7d; add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Adminer (веб-СУБД) на /postgres — ОБЯЗАТЕЛЬНО под Basic Auth (панель БД в интернете).
    # resolver + переменная: nginx стартует даже если контейнер adminer не поднят
    # (иначе не найдя upstream, nginx не запустился бы и уронил весь сайт).
    location = /postgres { return 301 /postgres/; }
    location ^~ /postgres/ {
        auth_basic "Mirai DB";
        auth_basic_user_file /etc/nginx/ssl/adminer.htpasswd;
        resolver 127.0.0.11 valid=30s;
        set $adminer http://mirai-adminer:8080;
        rewrite ^/postgres/(.*)$ /$1 break;
        proxy_pass $adminer;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /postgres/;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;   # ВСЕГДА front controller (Slim роутит по URI; исходники .php не отдаём)
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }
}
