# HTTP только для localhost (SSL-конфиг выше обрабатывает mirailounge.ru)
server {
    listen 80;
    server_name localhost;
    root /var/www/mirailounge/public;

    index index.php index.html;

    # Без ^~: иначе /orders/index.php не попадает в location ~ \.php$ и отдаётся как статика.
    location /orders/ {
        try_files $uri $uri/ /orders/index.php?$query_string;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Без ^~: иначе index.php отдаётся как файл. Вложенный location — PHP через FPM.
    location /vipservice/ {
        try_files $uri $uri/ /vipservice/index.php?$query_string;
        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /admin/ {
        alias /var/www/mirailounge/admin/;
        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    location = /admin {
        return 301 /admin/;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
