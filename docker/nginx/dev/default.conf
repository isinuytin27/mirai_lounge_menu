# ЛОКАЛЬНЫЙ dev-vhost (HTTP, без SSL). Всё идёт в единый front controller (public/index.php).
server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/mirailounge/public;

    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # DEV: не кэшируем ассеты, чтобы правки CSS/JS сразу подхватывались.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|webp|webm|mp4)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
