# ЛОКАЛЬНЫЙ dev-vhost (HTTP, без SSL). Направляет всё на НОВЫЙ front controller
# (public/index-new.php) — чтобы видеть новый стек через nginx+php-fpm.
# Прод-конфиги (conf.d/*.conf со старым index.php и SSL) здесь не подключаются.
server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/mirailounge/public;

    index index-new.php;

    # Статика отдаётся напрямую, всё остальное — в новый front controller.
    location / {
        try_files $uri /index-new.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # DEV: не кэшируем ассеты, чтобы правки CSS/JS сразу подхватывались.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|webp|webm|mp4)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
