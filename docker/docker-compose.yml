services:
  nginx:
    image: nginx:alpine
    container_name: mirai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../public:/var/www/mirailounge/public:ro
      - ../admin:/var/www/mirailounge/admin:ro
      - ../config:/var/www/mirailounge/config:ro
      - ../data:/var/www/mirailounge/data
      - ../public/assets/img/menu/uploads:/var/www/mirailounge/public/assets/img/menu/uploads
      - ../public/assets/img/gallery/uploads:/var/www/mirailounge/public/assets/img/gallery/uploads
      - ../public/assets/img/vip/partner_uploads:/var/www/mirailounge/public/assets/img/vip/partner_uploads
      # Mirai Pro (miraipro.ru) — код сюда кладёт mirai_pro\deploy\install-into-stack.bat. Код ro, data rw.
      - ../miraipro_site:/var/www/miraipro:ro
      - ../miraipro_site/data:/var/www/miraipro/data
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: mirai-php
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../public:/var/www/mirailounge/public:ro
      - ../admin:/var/www/mirailounge/admin:ro
      - ../config:/var/www/mirailounge/config:ro
      - ../scripts:/var/www/mirailounge/scripts:ro
      # Новый каркас (Slim): код, консольные утилиты, миграции, справочники
      - ../src:/var/www/mirailounge/src:ro
      - ../bin:/var/www/mirailounge/bin:ro
      - ../migrations:/var/www/mirailounge/migrations:ro
      - ../resources:/var/www/mirailounge/resources:ro
      - ../phinx.php:/var/www/mirailounge/phinx.php:ro
      - ../data:/var/www/mirailounge/data
      - ../public/assets/img/menu/uploads:/var/www/mirailounge/public/assets/img/menu/uploads
      - ../public/assets/img/gallery/uploads:/var/www/mirailounge/public/assets/img/gallery/uploads
      - ../public/assets/img/vip/partner_uploads:/var/www/mirailounge/public/assets/img/vip/partner_uploads
      # Mirai Pro (miraipro.ru) — код сюда кладёт mirai_pro\deploy\install-into-stack.bat. Код ro, data rw.
      - ../miraipro_site:/var/www/miraipro:ro
      - ../miraipro_site/data:/var/www/miraipro/data
    # Postgres вынесен в общий платформенный стек (docker/platform). Сайт подключается
    # к нему по сети mirai-platform (host=postgres). Поднять платформу нужно ДО сайта:
    #   docker compose -f docker/platform/docker-compose.yml up -d
    networks:
      - default
      - platform
    restart: unless-stopped

# Внешняя сеть общей платформы (создаётся docker/platform/docker-compose.yml).
networks:
  platform:
    external: true
    name: mirai-platform
